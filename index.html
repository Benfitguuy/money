<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我們的錢包">
<meta name="theme-color" content="#F3F2EE">
<title>我們的錢包</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="th-money">
<div id="app">
  <div id="page-money" class="page">
    <header>
      <div class="top">
        <h1 id="money-title"></h1>
        <div class="top-btns">
          <span id="money-monthnav"><button id="money-prev" class="arrow" aria-label="上個月">‹</button><button id="money-next" class="arrow" aria-label="下個月">›</button></span>
          <button id="money-add" class="round" aria-label="記一筆">＋</button>
        </div>
      </div>
    </header>
    <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
    <main class="mscroll">
      <div id="money-list"></div>
      <div id="money-stat" hidden>
        <div class="mtabs st-kind"><button data-k="expense">支出</button><button data-k="income">收入</button></div>
        <div class="mtabs st-by"><button data-b="cat">依分類</button><button data-b="acct">依帳戶</button></div>
        <div id="money-stat-body"></div>
      </div>
      <div id="money-acct" hidden></div>
      <div id="money-ins" hidden></div>
      <div id="money-pts" hidden></div>
    </main>
    <nav class="mntabs mnav">
      <button data-tab="acct"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>帳戶</button>
      <button data-tab="stat"><svg viewBox="0 0 24 24"><rect x="3" y="12" width="4.5" height="9" rx="1.5"/><rect x="9.75" y="7" width="4.5" height="14" rx="1.5"/><rect x="16.5" y="3" width="4.5" height="18" rx="1.5"/></svg>統計</button>
      <button data-tab="list"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>明細</button>
      <button data-tab="ins"><svg viewBox="0 0 24 24"><path d="M12 2.5 20 5.5v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/></svg>保險</button>
      <button data-tab="pts"><svg viewBox="0 0 24 24"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0v5l-8 5v2l8-2.5v5.5L8 20v1.5l3.5-1 3.5 1V20l-2-1.5V13z"/></svg>點數</button>
    </nav>
  </div>
</div>
<div id="sheetwrap" hidden><div id="sheet"></div></div>
<div id="toast"></div>
<script src="chars.js"></script><script src="extra.js"></script><script src="app.js"></script>
</body>
</html>
